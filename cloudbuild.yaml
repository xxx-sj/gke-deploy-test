# cloudbuild.yaml
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "1800s"   # 30분

substitutions:
  _REGION: ""                 # 예: asia-northeast3
  _PROJECT: ""                # 예: bold-proton-467706-f3
  _REPO: ""                   # 예: asia-northeast3-docker.pkg.dev/.../vtyle-dev-repo/app
  _MIG_NAME: ""               # 예: app-vtyle-dev (리전 MIG)
  _TPL_BASE: ""               # 예: app-tpl-base-vtyle-dev (템플릿 베이스 이름)
  _TPL_PREFIX: ""             # 예: app-tpl-base-vtyle-dev (정리/롤백용 접두사)
  _MIG_NAMES: ""              # 예: app-vtyle-dev,app-worker-dev (정리 시 보호할 MIG들)
  _KEEP_NUM: "3"              # 정리 시 보관 개수(기본 3)
  _STARTUP_SCRIPT_PATH: ""    # 예: gs://vtyle/app-startup.sh 또는 리포 내 로컬 경로
  _SLACK_WEBHOOK: ""          # (선택)
  _VPC_NETWORK: ""
  _SUBNET_A: ""

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args: ["build","-t","${_REPO}:$SHORT_SHA","-t","${_REPO}:latest","."]

  - name: gcr.io/cloud-builders/docker
    id: push-sha
    args: ["push","${_REPO}:$SHORT_SHA"]

  - name: gcr.io/cloud-builders/docker
    id: push-latest
    args: ["push","${_REPO}:latest"]

  # 3) GLOBAL Instance Template (GA)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    id: create-template
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        PROJECT="${_PROJECT}"; REGION="${_REGION}"
        TPL_NEW="${_TPL_BASE}-${SHORT_SHA}"
        IMAGE_URI="${_REPO}:$SHORT_SHA"
        VPC_NETWORK="${_VPC_NETWORK}"
        SUBNET_NAME="${_SUBNET_A}"

        [[ -z "$${VPC_NETWORK}" || -z "$${SUBNET_NAME}" ]] && { echo "substitutions missing"; exit 1; }

        METADATA="IMAGE_URI=$${IMAGE_URI},ENVIRONMENT=dev"
        STARTUP_FILE_FLAG=()
        if [[ -n "${_STARTUP_SCRIPT_PATH}" ]]; then
          if [[ "${_STARTUP_SCRIPT_PATH}" == gs://* ]]; then
            METADATA="$${METADATA},startup-script-url=${_STARTUP_SCRIPT_PATH}"
          else
            STARTUP_FILE_FLAG=( --metadata-from-file=startup-script="${_STARTUP_SCRIPT_PATH}" )
          fi
        fi

        SUBNET_URI="projects/$${PROJECT}/regions/$${REGION}/subnetworks/$${SUBNET_NAME}"

        gcloud compute instance-templates create "$${TPL_NEW}" \
          --project="$${PROJECT}" \
          --metadata="$${METADATA}" "$${STARTUP_FILE_FLAG[@]}" \
          --machine-type="e2-medium" \
          --image-family="debian-11" --image-project="debian-cloud" \
          --network="$${VPC_NETWORK}" \
          --subnet="$${SUBNET_URI}" \
          --scopes="cloud-platform" \
          --no-address

        echo "$${TPL_NEW}" > /workspace/tpl_name.txt

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    id: ensure-size
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        CUR=$(gcloud compute instance-groups managed describe "${_MIG_NAME}" \
          --region="${_REGION}" --format='value(targetSize)' || echo 0)
        if [[ "$${CUR:-0}" -eq 0 ]]; then
          echo "MIG size is 0 → resizing to 1"
          gcloud compute instance-groups managed resize "${_MIG_NAME}" \
            --region="${_REGION}" --size=1
        else
          echo "MIG size = $${CUR}, keep as is."
        fi

  # 4) 롤링 업데이트 (GA)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    id: rolling-update
    waitFor: ['ensure-size']
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        TPL_NEW="$(cat /workspace/tpl_name.txt)"
        TPL_PATH="projects/${_PROJECT}/global/instanceTemplates/$${TPL_NEW}"
        gcloud compute instance-groups managed rolling-action start-update "${_MIG_NAME}" \
          --region="${_REGION}" --type=proactive --max-surge=1 --max-unavailable=0 \
          "--version=template=$${TPL_PATH}"
        echo ok > /workspace/deploy.ok
    allowFailure: true

  # 5) 안정화 대기 (GA)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    id: wait-stable
    entrypoint: bash
    waitFor: ['rolling-update']
    args:
      - -lc
      - |
        set -euo pipefail
        if gcloud compute instance-groups managed wait-until "${_MIG_NAME}" \
          --stable --region="${_REGION}" --timeout=900; then
          echo ok > /workspace/stable.ok
        else
          exit 1
        fi
    allowFailure: true

  # 6) 템플릿 정리 (GA)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    id: prune-old-templates
    entrypoint: bash
    waitFor: ['wait-stable']
    args:
      - -lc
      - |
        set -euo pipefail
        [[ ! -f /workspace/stable.ok ]] && { echo "skip prune"; exit 0; }
        PROJECT="${_PROJECT}"; TPL_PREFIX="${_TPL_PREFIX}"; KEEP="${_KEEP_NUM:-3}"

        IFS=',' read -r -a MIGS <<< "${_MIG_NAMES}"
        PROTECT_LINKS=""
        for MIG in "$${MIGS[@]}"; do
          [[ -z "$${MIG}" ]] && continue
          LINKS=$(gcloud compute instance-groups managed describe "$${MIG}" \
            --project="$${PROJECT}" --region="${_REGION}" \
            --format="value(versions[].instanceTemplate)" || true)
          PROTECT_LINKS="$${PROTECT_LINKS} $${LINKS}"
        done
        PROTECT_NAMES=$(echo "$${PROTECT_LINKS}" | sed -E 's#.*/instanceTemplates/##g' | tr ' ' '\n' | sort -u)

        mapfile -t ALL < <(gcloud compute instance-templates list \
          --project="$${PROJECT}" \
          --filter="name~'^$${TPL_PREFIX}'" \
          --sort-by="~creationTimestamp" \
          --format="value(name)")

        TO_DELETE=(); CNT=0
        for T in "$${ALL[@]}"; do
          echo "$${PROTECT_NAMES}" | grep -qx "$${T}" && continue
          CNT=$((CNT+1)); (( CNT > KEEP )) && TO_DELETE+=("$${T}")
        done
        for T in "$${TO_DELETE[@]}"; do
          gcloud compute instance-templates delete "$${T}" --project="$${PROJECT}" --quiet
        done

  # 7) 롤백 (GA)
  # 7) 롤백 (GA)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    id: rollback-on-failure
    entrypoint: bash
    waitFor: ['wait-stable']
    args:
      - -lc
      - |
        set -euo pipefail
        # 안정화 성공 마커가 없으면 롤백
        if [[ -f /workspace/stable.ok ]]; then
          echo "stable.ok found → skip rollback"
          exit 0
        fi
        
        echo "No stable.ok → start rollback to previous template"
        PROJECT="${_PROJECT}"; REGION="${_REGION}"; TPL_PREFIX="${_TPL_PREFIX}"; MIG="${_MIG_NAME}"
        
        PREV=$(gcloud compute instance-templates list \
          --project="$${PROJECT}" --filter="name~'^$${TPL_PREFIX}'" \
          --sort-by="~creationTimestamp" --format="value(name)" | sed -n '2p')
        
        [[ -z "$${PREV}" ]] && { echo "no previous template"; exit 1; }
        
        TPL_PATH="projects/$${PROJECT}/global/instanceTemplates/$${PREV}"
        gcloud compute instance-groups managed rolling-action start-update "$${MIG}" \
          --project="$${PROJECT}" --region="$${REGION}" \
          --type=proactive --max-surge=0 --max-unavailable=1 \
          --version="template=$${TPL_PATH}"
        exit 1

images:
  - "${_REPO}:$SHORT_SHA"
  - "${_REPO}:latest"
