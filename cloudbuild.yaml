# cloudbuild.yaml
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "1800s"   # 30분

substitutions:
  _REGION: ""                 # 예: asia-northeast3
  _PROJECT: ""                # 예: bold-proton-467706-f3
  _REPO: ""                   # 예: asia-northeast3-docker.pkg.dev/.../vtyle-dev-repo/app
  _MIG_NAME: ""               # 예: app-vtyle-dev (리전 MIG)
  _TPL_BASE: ""               # 예: app-tpl-base-vtyle-dev (리전 템플릿 '베이스' 이름)
  _TPL_PREFIX: ""             # 예: app-tpl-dev (정리/롤백용 접두사; 환경별로 다르게)
  _MIG_NAMES: ""              # 예: app-vtyle-dev,app-worker-dev (정리 시 보호할 MIG들)
  _KEEP_NUM: "3"              # 정리 시 보관 개수(기본 3)
  _STARTUP_SCRIPT_PATH: ""    # 예: gs://vtyle/app-startup.sh 또는 리포 내 로컬 경로
  _SLACK_WEBHOOK: ""          # (선택)

steps:
  # 1) Build
  - name: gcr.io/cloud-builders/docker
    id: build
    args: ["build","-t","${_REPO}:$SHORT_SHA","-t","${_REPO}:latest","."]

  # 2) Push
  - name: gcr.io/cloud-builders/docker
    id: push-sha
    args: ["push","${_REPO}:$SHORT_SHA"]

  - name: gcr.io/cloud-builders/docker
    id: push-latest
    args: ["push","${_REPO}:latest"]

  # 3) 새 Regional Instance Template 생성 (베이스 복제 + 이미지/스크립트 주입)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    id: create-template
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        
        TPL_BASE="${_TPL_BASE}"
        TPL_NEW="${_TPL_BASE}-${SHORT_SHA}"
        IMAGE_URI="${_REPO}:$SHORT_SHA"
        PROJECT="${_PROJECT}"
        REGION="${_REGION}"
        CONFIG_FILE="template_config.yaml"

        echo "Creating regional IT: $${TPL_NEW} in $${REGION}"

        # 1. 기존 템플릿 설정을 YAML 파일로 내보내기 (Regional 템플릿은 gcloud beta 사용)
        gcloud beta compute region-instance-templates export "$${TPL_BASE}" \
          --project="$${PROJECT}" \
          --region="$${REGION}" \
          --destination="$${CONFIG_FILE}"

        # 2. YAML 파일 수정: 새 템플릿 이름과 새 컨테이너 이미지 주입을 위해 'disk' 설정 수정
        #    YAML 파싱/수정은 'yq' 등의 외부 도구가 필요하여 복잡하므로,
        #    여기서는 메타데이터와 컨테이너 이미지/디스크 설정을 직접 GCloud 플래그로 덮어쓰는 방식을 사용합니다.
        
        # 3. 공통 metadata를 하나로 구성
        METADATA="IMAGE_URI=$${IMAGE_URI},ENVIRONMENT=dev"

        # 4. startup script 처리 (기존 로직 유지)
        STARTUP_FILE_FLAG=()
        if [[ -n "${_STARTUP_SCRIPT_PATH}" ]]; then
          if [[ "${_STARTUP_SCRIPT_PATH}" == gs://* ]]; then
            METADATA="$$METADATA,startup-script-url=${_STARTUP_SCRIPT_PATH}"
          else
            STARTUP_FILE_FLAG=( --metadata-from-file=startup-script="${_STARTUP_SCRIPT_PATH}" )
          fi
        fi

        # 5. Import 명령어로 새로운 템플릿 생성
        #    Import는 기존 설정을 YAML로 가져온 후 새 이름으로 생성할 때 적합합니다.
        #    가장 간단하고 GCloud에서 지원하는 방식은 'create' 대신 'export' 후 'import'입니다.

        # 임시 YAML 수정: name만 변경하고 import (실제 환경에서는 yq 필요)
        # sed를 사용해 'name' 필드만 교체하는 가장 간단한 방법 사용
        sed -i "s/^name: .*/name: $${TPL_NEW}/" "$${CONFIG_FILE}"

        # 이미지 업데이트를 위한 '--container-image'가 없으므로,
        # 메타데이터를 사용하여 'gcloud compute instance-templates import'로 새 템플릿 생성
        gcloud beta compute region-instance-templates import "$${TPL_NEW}" \
          --project="$${PROJECT}" \
          --region="$${REGION}" \
          --source="$${CONFIG_FILE}" \
          --no-user-output-enabled # Import는 항상 beta를 사용합니다.

        # 메타데이터를 덮어쓰기 위해, 새로 만든 템플릿을 다시 업데이트해야 합니다.
        # 템플릿은 생성 후 변경이 어렵기 때문에, 사실 이 접근 자체가 비효율적입니다.
        
        # **가장 실용적인 수정 (템플릿 소스 지정 대신 필요한 옵션 명시):**
        # 베이스 템플릿(_TPL_BASE)의 머신 타입, 네트워크, 부트 디스크 이미지 등을
        # 직접 파악하여 `--machine-type`, `--image-family` 등으로 대체해야 합니다.
        # 이 정보를 알 수 없으므로, 베이스 템플릿을 **직접 소스로 사용하지 않는** 방식으로 변경합니다.

        # **--source-instance-template 대신 gcloud compute instance-templates create-with-container 사용:**
        # (만약 템플릿이 컨테이너 기반으로 설정되어 있다면 이 명령어가 유용합니다.)
        gcloud compute instance-templates create-with-container "$${TPL_NEW}" \
            --project="${_PROJECT}" \
            --container-image="$${IMAGE_URI}" \
            --metadata="$$METADATA" \
            "$${STARTUP_FILE_FLAG[@]}" \
            --region="${_REGION}" \
            # --machine-type, --boot-disk-type 등 나머지 필요한 옵션 추가
        
        echo "$${TPL_NEW}" > tpl_name.txt

  # 4) MIG 무중단 롤링 업데이트
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    id: rolling-update
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        TPL_NEW="$(cat tpl_name.txt)"
        TPL_SELF="projects/${_PROJECT}/regions/${_REGION}/instanceTemplates/$${TPL_NEW}"

        echo "Start proactive rolling update of MIG ${_MIG_NAME} with $${TPL_SELF}"
        
        gcloud compute instance-groups managed rolling-action start-update "$${_MIG_NAME}" \
          --region="${_REGION}" \
          --type=proactive \
          --max-surge=1 \
          --max-unavailable=0 \
          --version="template=projects/${_PROJECT}/regions/${_REGION}/instanceTemplates/$${TPL_NEW}"
  # 5) 안정화 대기
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    id: wait-stable
    args:
      [
        "compute","instance-groups","managed","wait-until-stable","${_MIG_NAME}",
        "--region=${_REGION}","--timeout=900s"
      ]

  # 6) (성공 시) 오래된 템플릿 정리: 최신 N개만 유지, 동일 환경의 MIG들이 쓰는 템플릿 보호
  # ▶ 별도 조건 필요 없음 (앞이 실패하면 여기까지 도달하지 않음 = 기본이 SUCCESS 전용)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    id: prune-old-templates
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        PROJECT="${_PROJECT}"
        REGION="${_REGION}"
        TPL_PREFIX="${_TPL_PREFIX}"
        KEEP="${_KEEP_NUM:-3}"

        IFS=',' read -r -a MIGS <<< "${_MIG_NAMES}"

        PROTECT_LINKS=""
        for MIG in "$${MIGS[@]}"; do
          [[ -z "$${MIG}" ]] && continue
          LINKS=$(gcloud compute instance-groups managed describe "$${MIG}" \
            --project="$${PROJECT}" --region="$${REGION}" \
            --format="value(versions[].instanceTemplate)" || true)
          PROTECT_LINKS="$${PROTECT_LINKS} $${LINKS}"
        done

        PROTECT_NAMES=$(echo "$${PROTECT_LINKS}" | sed -E 's#.*/instanceTemplates/##g' | tr ' ' '\n' | sort -u)

        echo "Protect templates referenced by MIGs:"
        echo "$${PROTECT_NAMES}"

        mapfile -t ALL < <(gcloud beta compute region-instance-templates list \
          --project="$${PROJECT}" --region="$${REGION}" \
          --filter="name~'^$${TPL_PREFIX}'" \
          --sort-by="~creationTimestamp" \
          --format="value(name)")

        echo "Found templates (newest first) with prefix '$${TPL_PREFIX}':"
        printf '%s\n' "$${ALL[@]}"

        TO_DELETE=()
        COUNT=0
        for T in "$${ALL[@]}"; do
          if echo "$${PROTECT_NAMES}" | grep -qx "$${T}"; then
            continue
          fi
          COUNT=$((COUNT+1))
          if (( COUNT > KEEP )); then
            TO_DELETE+=("$${T}")
          fi
        done

        if (( $${#TO_DELETE[@]} == 0 )); then
          echo "Nothing to delete."
          exit 0
        fi

        echo "Deleting old templates:"
        printf ' - %s\n' "$${TO_DELETE[@]}"
        for T in "$${TO_DELETE[@]}"; do
          gcloud beta compute region-instance-templates delete "$${T}" \
            --project="$${PROJECT}" --region="$${REGION}" --quiet
        done

  # 7) (실패 시) 자동 롤백: 항상 실행하지만 '빌드가 최종 실패'일 때만 동작
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    id: rollback-on-failure
    entrypoint: bash
    waitFor: [ '-' ]
    args:
      - -lc
      - |
        set -euo pipefail
        PROJECT="${_PROJECT}"
        REGION="${_REGION}"

        # 최종 상태 폴링
        while true; do
          STATUS=$(gcloud builds describe "$BUILD_ID" \
            --project "$${PROJECT}" --region "$${REGION}" \
            --format='value(status)' || echo "UNKNOWN")

          case "$$STATUS" in
            SUCCESS) echo "Build succeeded; skip rollback."; exit 0 ;;
            FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
              echo "⚠️ Build status = $$STATUS → starting rollback..."; break ;;
            QUEUED|WORKING|PENDING|UNKNOWN|"") sleep 5 ;;
            *) echo "Unexpected build status: $$STATUS (skip rollback)"; exit 0 ;;
          esac
        done

        MIG="${_MIG_NAME}"
        TPL_PREFIX="${_TPL_PREFIX}"

        PREV=$(
          gcloud beta compute region-instance-templates list \
            --project="$${PROJECT}" --region="$${REGION}" \
            --filter="name~'^$${TPL_PREFIX}'" \
            --sort-by="~creationTimestamp" \
            --format="value(name)" | sed -n '2p'
        )

        if [[ -z "$${PREV}" ]]; then
          echo "No previous template found. Skip rollback (do not fail build)."
          exit 0
        fi

        echo "Rolling back to $${PREV} ..."
        gcloud compute instance-groups managed rolling-action start-update "$${MIG}" \
          --project="$${PROJECT}" --region="$${REGION}" \
          --type=proactive --max-surge=0 --max-unavailable=1 \
          --version="template=projects/$${PROJECT}/regions/$${REGION}/instanceTemplates/$${PREV}"

        echo "✅ Rollback triggered."

images:
  - "${_REPO}:$SHORT_SHA"
  - "${_REPO}:latest"