# cloudbuild-prod.yaml
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "1800s"

substitutions:
  _REGION: ""
  _PROJECT: ""
  _REPO: ""
  _TPL_BASE: ""
  _TPL_PREFIX: ""
  _MIGS: ""
  _ZONES: ""
  _SUBNETS: ""
  _ENV_SECRETS: ""
  _KEEP_NUM: "3"
  _STARTUP_SCRIPT_PATH: ""
  _SLACK_WEBHOOK: ""
  _VPC_NETWORK: ""
  _SA_EMAIL: ""

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args: ["build","-t","${_REPO}:$SHORT_SHA","-t","${_REPO}:latest","."]

  - name: gcr.io/cloud-builders/docker
    id: push-sha
    args: ["push","${_REPO}:$SHORT_SHA"]

  - name: gcr.io/cloud-builders/docker
    id: push-latest
    args: ["push","${_REPO}:latest"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    id: deploy-migs
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail

        PROJECT="${_PROJECT}"
        REGION="${_REGION}"
        VPC_NETWORK="${_VPC_NETWORK}"
        IMAGE_URI="${_REPO}:$SHORT_SHA"

        IFS=',' read -r -a MIG_NAMES   <<< "${_MIGS}"
        IFS=',' read -r -a ZONES       <<< "${_ZONES}"
        IFS=',' read -r -a SUBNETS     <<< "${_SUBNETS}"
        IFS=',' read -r -a ENV_SECRETS <<< "${_ENV_SECRETS}"

        (( ${#MIG_NAMES[@]} > 0 )) || { echo "ERROR: _MIGS is empty"; exit 1; }
        if ((${#MIG_NAMES[@]} != ${#ZONES[@]} || ${#MIG_NAMES[@]} != ${#SUBNETS[@]} || ${#MIG_NAMES[@]} != ${#ENV_SECRETS[@]})); then
          echo "ERROR: MIGS/ZONES/SUBNETS/ENV_SECRETS counts must match."; exit 1
        fi

        STARTUP_FILE_FLAG=()
        METADATA_BASE="IMAGE_URI=$${IMAGE_URI},ENVIRONMENT=prod"
        if [[ -n "${_STARTUP_SCRIPT_PATH}" ]]; then
          if [[ "${_STARTUP_SCRIPT_PATH}" == gs://* ]]; then
            METADATA_BASE="${METADATA_BASE},startup-script-url=${_STARTUP_SCRIPT_PATH}"
          else
            STARTUP_FILE_FLAG=( --metadata-from-file=startup-script="${_STARTUP_SCRIPT_PATH}" )
          fi
        fi

        : > /workspace/prev_templates.csv

        for i in "${!MIG_NAMES[@]}"; do
          MIG="${MIG_NAMES[$i]}"
          ZONE="${ZONES[$i]}"
          SUBNET_NAME="${SUBNETS[$i]}"
          ENV_SECRET_NAME="${ENV_SECRETS[$i]}"

          [[ -n "$MIG" && -n "$ZONE" && -n "$SUBNET_NAME" && -n "$ENV_SECRET_NAME" ]] \
            || { echo "ERROR: empty item at index $i"; exit 1; }

          SUBNET_URI="projects/${PROJECT}/regions/${REGION}/subnetworks/${SUBNET_NAME}"
          TPL_NEW="${_TPL_BASE}-${SUBNET_NAME}-${SHORT_SHA}"
          METADATA="${METADATA_BASE},ENV_SECRET_NAME=${ENV_SECRET_NAME}"

          CUR_TEMPLATE=$(gcloud compute instance-groups managed describe "${MIG}" \
            --zone="${ZONE}" --format="value(versions[0].instanceTemplate)" || true)
          echo "${MIG},${ZONE},${CUR_TEMPLATE}" >> /workspace/prev_templates.csv

          echo "=== [${MIG} @ ${ZONE}] Create template: ${TPL_NEW}"
          SA_FLAGS=()
          if [[ -n "${_SA_EMAIL}" ]]; then
            SA_FLAGS=( --service-account="${_SA_EMAIL}" --scopes="https://www.googleapis.com/auth/cloud-platform" )
          else
            SA_FLAGS=( --scopes="cloud-platform" )
          fi

          gcloud compute instance-templates create "${TPL_NEW}" \
            --project="${PROJECT}" \
            --metadata="${METADATA}" "${STARTUP_FILE_FLAG[@]}" \
            --machine-type="e2-medium" \
            --image-family="debian-11" --image-project="debian-cloud" \
            --boot-disk-size="30GB" \
            --network="${VPC_NETWORK}" \
            --subnet="${SUBNET_URI}" \
            --tags="prod-node-server,lb-health-check" \
            --no-address \
            "${SA_FLAGS[@]}"

          CUR_SIZE=$(gcloud compute instance-groups managed describe "${MIG}" \
            --zone="${ZONE}" --format='value(targetSize)' || echo 0)
          if [[ "${CUR_SIZE:-0}" -eq 0 ]]; then
            gcloud compute instance-groups managed resize "${MIG}" --zone="${ZONE}" --size=1
          fi

          TPL_PATH="projects/${PROJECT}/global/instanceTemplates/${TPL_NEW}"
          echo "Update ${MIG} → ${TPL_PATH}"
          gcloud compute instance-groups managed rolling-action start-update "${MIG}" \
            --zone="${ZONE}" \
            --type=proactive --max-surge=1 --max-unavailable=0 \
            "--version=template=${TPL_PATH}"

          gcloud compute instance-groups managed wait-until "${MIG}" --zone="${ZONE}" --stable --timeout=900
        done

        echo ok > /workspace/deploy.ok

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    id: prune-old-templates
    entrypoint: bash
    waitFor: ['deploy-migs']
    args:
      - -lc
      - |
        set -euo pipefail
        [[ ! -f /workspace/deploy.ok ]] && { echo "skip prune (no deploy.ok)"; exit 0; }

        PROJECT="${_PROJECT}"
        TPL_PREFIX="${_TPL_PREFIX}"
        KEEP="${_KEEP_NUM:-3}"

        IFS=',' read -r -a MIGS  <<< "${_MIGS}"
        IFS=',' read -r -a ZONES <<< "${_ZONES}"

        PROTECT_LINKS=""
        for i in "${!MIGS[@]}"; do
          MIG="${MIGS[$i]}"; ZONE="${ZONES[$i]}"
          [[ -z "${MIG}" ]] && continue
          LINKS=$(gcloud compute instance-groups managed describe "${MIG}" \
            --project="${PROJECT}" --zone="${ZONE}" \
            --format="value(versions[].instanceTemplate)" || true)
          PROTECT_LINKS="${PROTECT_LINKS} ${LINKS}"
        done

        PROTECT_NAMES=$(echo "${PROTECT_LINKS}" | sed -E 's#.*/instanceTemplates/##g' | tr ' ' '\n' | sort -u)

        mapfile -t ALL < <(gcloud compute instance-templates list \
          --project="${PROJECT}" \
          --filter="name~'^${TPL_PREFIX}'" \
          --sort-by="~creationTimestamp" \
          --format="value(name)")

        TO_DELETE=(); COUNT=0
        for T in "${ALL[@]}"; do
          echo "${PROTECT_NAMES}" | grep -qx "${T}" && continue
          COUNT=$((COUNT+1))
          (( COUNT > KEEP )) && TO_DELETE+=("${T}")
        done

        (( ${#TO_DELETE[@]} )) || { echo "Nothing to delete."; exit 0; }
        printf 'Deleting old templates:\n - %s\n' "${TO_DELETE[@]}"
        for T in "${TO_DELETE[@]}"; do
          gcloud compute instance-templates delete "${T}" --project="${PROJECT}" --quiet
        done

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    id: rollback-on-failure
    entrypoint: bash
    waitFor: ['deploy-migs']
    args:
      - -lc
      - |
        set -euo pipefail
        if [[ -f /workspace/deploy.ok ]]; then
          echo "deploy.ok exists → skip rollback"
          exit 0
        fi

        echo "⚠️ Deployment failed → trying to rollback using prev_templates.csv ..."
        [[ -s /workspace/prev_templates.csv ]] || { echo "No prev_templates.csv → cannot rollback"; exit 1; }

        ROLLBACKED=0
        while IFS=, read -r MIG ZONE PREV_PATH; do
          [[ -z "$MIG" || -z "$ZONE" ]] && continue
          if [[ -n "$PREV_PATH" ]]; then
            echo "Rollback ${MIG} → ${PREV_PATH}"
            gcloud compute instance-groups managed rolling-action start-update "${MIG}" \
              --zone="${ZONE}" \
              --type=proactive --max-surge=0 --max-unavailable=1 \
              --version="template=${PREV_PATH}"
            ROLLBACKED=1
          else
            echo "(${MIG}) no previous template recorded; skip"
          fi
        done < /workspace/prev_templates.csv

        [[ "${ROLLBACKED}" -eq 1 ]] || echo "Nothing rolled back."
        exit 1

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    id: notify
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        [[ -z "${_SLACK_WEBHOOK}" ]] && { echo "skip slack"; exit 0; }
        STATUS="SUCCESS"
        [[ ! -f /workspace/deploy.ok ]] && STATUS="FAILURE"
        PAYLOAD=$(printf '{"text":"*prod deploy* %s\nrepo: %s\nsha: %s\nregion: %s\nmigs: %s"}' \
          "${STATUS}" "${_REPO}" "$SHORT_SHA" "${_REGION}" "${_MIGS}")
        curl -s -X POST -H 'Content-type: application/json' \
          --data "${PAYLOAD}" \
          "${_SLACK_WEBHOOK}" || true

images:
  - "${_REPO}:$SHORT_SHA"
  - "${_REPO}:latest"